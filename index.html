<header><div><h1>MusicTheory</h1><small>作曲スケッチ / MIDI</small></div><span class="tag">3トラック · 最大16小節</span></header>
<main>
<section class="panel"><div class="controls">
<div class="field"><label>KEY</label><select id="key"></select></div><div class="field"><label>音階</label><select id="scale"><option value="major">メジャー</option><option value="naturalMinor">ナチュラルマイナー</option><option value="harmonicMinor">ハーモニックマイナー</option><option value="dorian">ドリアン</option><option value="mixolydian">ミクソリディアン</option><option value="lydian">リディアン</option><option value="phrygian">フリジアン</option><option value="minorPentatonic">マイナーペンタトニック</option><option value="majorPentatonic">メジャーペンタトニック</option></select></div><div class="field"><label>BPM</label><input id="bpm" type="number" min="40" max="240" value="140"></div><div class="field"><label>拍子</label><select id="meter"><option value="4">4/4</option><option value="3">3/4</option><option value="5">5/4</option><option value="7">7/8</option></select></div><div class="field"><label>小節</label><select id="bars"><option>4</option><option>8</option><option selected>16</option></select></div><div class="field"><label>進行（度数）</label><input id="degrees" value="I V vi IV" style="min-width:210px"></div><button class="primary" id="generate">MIDIを作成</button></div></section>
<div class="topgrid"><section class="panel"><h3 class="sectiontitle">五度圏・音程の性格</h3><svg class="wheel" viewBox="0 0 340 340" id="wheel" role="img" aria-label="12音の五度圏と音程の性格"></svg><div class="wheel-legend"><span><i class="swatch" style="background:#ed4d9b"></i>主音</span><span><i class="swatch" style="background:#55a99d"></i>主和音の構成音</span><span><i class="swatch" style="background:#9275bd"></i>スケール内</span><span><i class="swatch" style="background:#f0e9ee;border:1px solid #c7b9c6"></i>スケール外</span></div><div id="wheelInfo" class="wheel-info">音を選ぶと、主音との音程と一般的な役割を表示します。</div></section>
<section class="panel"><div class="row spread"><h3 class="sectiontitle">コード進行</h3><span id="keyLabel" class="tag">C · Major</span></div><div id="progression" class="progression"></div><div class="row" style="margin-top:14px"><button id="play" class="primary">▶ 再生</button><button id="stop">■ 停止</button><button id="export" class="primary">MIDIを書き出す</button><label class="actions"><span class="tag">MIDI読込</span><input type="file" id="midiFile" accept=".mid,.midi" style="max-width:190px"></label></div></section></div>
<section class="panel"><div class="row spread"><h3 class="sectiontitle">MIDI編集</h3><span class="hint">クリック：追加 / ドラッグ：移動 / 空白ドラッグ：範囲選択 / Shift+クリック：削除</span></div><div class="tracktabs" id="tabs"><button data-track="bass" class="active">BASS</button><button data-track="drums">DRUMS</button><button data-track="pad">PAD</button></div><div class="canvaswrap"><canvas id="roll" width="1200" height="310"></canvas></div><div class="row spread" style="margin-top:10px"><span class="hint" id="trackHint">単音ベース</span><div class="actions"><button id="clearTrack">トラックを消去</button><button id="deleteSelected">選択ノートを削除</button></div></div></section>
<section class="panel">
<div class="row spread"><h3 class="sectiontitle">アレンジ指示</h3><span class="tag" id="apiState">API未接続</span></div>
<div class="row" style="margin:8px 0"><div class="field"><label>変更対象</label><select id="editMode"><option value="harmony">コード</option><option value="rhythm">リズム</option></select></div><div class="field wide" id="rhythmStyleField" hidden><label>リズムの方向性</label><select id="rhythmStyle"><option value="auto">自動で提案</option><option value="straight-pop">ストレート・ポップ</option><option value="shuffle">シャッフル</option><option value="half-time">ハーフタイム</option><option value="breakbeat">ブレイクビーツ</option><option value="funk">ファンク</option><option value="riddim">Riddim / Dubstep</option><option value="math-rock">Math Rock</option></select></div></div>
<textarea id="request" aria-label="アレンジ指示" placeholder="例：ベースの反復を増やし、2小節ごとにアクセントを変える。Padは短いコードスタブと休符を組み合わせる。"></textarea>
<div class="actions" style="margin-top:8px"><button class="primary" id="arrange">AIで生成して反映</button><button id="undoAI" hidden>元に戻す</button></div>
<p class="status" id="aiStatus" role="status"></p>
<div id="review" hidden>
<div class="row" style="margin-top:8px"><label for="candidate">候補</label><select id="candidate"></select></div>
<p id="candidateSummary"></p><p id="candidateNotes" class="hint"></p>
<div class="actions"><button id="playOriginal">元のMIDIを再生</button><button id="playCandidate">候補を再生</button><button id="stopPreview">停止</button><button id="applyCandidate" class="primary">選択候補を反映</button></div>
</div>
<details style="margin-top:12px"><summary>手動でChatGPTを使う</summary>
<div class="actions" style="margin:8px 0"><button id="buildBrief">依頼文を作成</button><button id="reviewJson">JSONを読み込む</button></div>
<textarea id="brief" aria-label="ChatGPT用依頼文" placeholder="ChatGPTに渡す依頼文"></textarea>
<textarea id="aiJson" aria-label="AI arrangement JSON" placeholder='{"candidates":[...]}' style="margin-top:8px"></textarea>
</details>
</section>
<section class="panel"><div class="row spread"><h3 class="sectiontitle">作曲データ</h3><input id="knowledgeSearch" placeholder="用語・進行・ジャンルを検索" style="max-width:300px"></div><div id="knowledge"></div></section><div class="status" id="status" role="status">準備完了</div><div class="status" id="storageStatus" role="status"></div>
</main>

$("roll").addEventListener("pointerdown",e=>{let p=pt(e),arr=tracks[active],unit=1200/bars(),pos=p.x/unit*beat();let i=arr.findIndex(n=>{let x=n.start/(beat())*unit,y=noteY(n);return p.x>=x-3&&p.x<=x+Math.max(10,n.duration/(beat())*unit)+3&&(active==="drums"||Math.abs(p.y-y)<18)});if(e.shiftKey&&i>=0){arr.splice(i,1);selected=-1;selectedSet.clear();renderAll();return}if(i>=0){if(!selectedSet.has(i)){selectedSet=new Set([i])}selected=i;drag={indices:[...selectedSet],originX:pos,originY:p.y,origins:[...selectedSet].map(j=>({...arr[j]}))}}else{selectBox={x:p.x,y:p.y,w:0,h:0};drag={selection:true};selected=-1;selectedSet.clear()}$("roll").setPointerCapture(e.pointerId);renderAll()});
$("roll").addEventListener("pointermove",e=>{if(!drag)return;let p=pt(e),unit=1200/bars(),pos=p.x/unit*beat();if(drag.selection){selectBox.w=p.x-selectBox.x;selectBox.h=p.y-selectBox.y;renderAll();return}let deltaBeat=Math.round((pos-drag.originX)*4)/4,deltaPitch=active==="drums"?0:Math.round((drag.originY-p.y)/(280/(active==="bass"?32:36)));drag.indices.forEach((idx,k)=>{let n=tracks[active][idx],o=drag.origins[k];n.start=Math.max(0,Math.min(bars()*beat()-o.duration,o.start+deltaBeat));if(active==="drums"){let lane=Math.max(0,Math.min(2,Math.round((p.y-42)/78)));n.pitch=[36,38,42][lane]}else n.pitch=Math.max(24,Math.min(96,o.pitch+deltaPitch))});renderAll()});
$("roll").addEventListener("pointerup",()=>{if(drag&&drag.selection&&selectBox){if(Math.abs(selectBox.w)<3&&Math.abs(selectBox.h)<3){let end=bars()*beat(),pos=selectBox.x/1200*end,pitch=active==="drums"?[36,38,42][Math.max(0,Math.min(2,Math.floor((selectBox.y-30)/78)))]:Math.round((active==="bass"?28:48)+(310-selectBox.y)/280*(active==="bass"?32:36)),start=Math.max(0,Math.min(end-.25,Math.floor(pos*4)/4));tracks[active].push({pitch,start,duration:Math.min(active==="drums"?.2:beat(),end-start),velocity:.75});selected=tracks[active].length-1;selectedSet=new Set([selected])}else{let x1=Math.min(selectBox.x,selectBox.x+selectBox.w),x2=Math.max(selectBox.x,selectBox.x+selectBox.w),y1=Math.min(selectBox.y,selectBox.y+selectBox.h),y2=Math.max(selectBox.y,selectBox.y+selectBox.h);tracks[active].forEach((n,i)=>{let x=n.start/(beat())*1200/bars(),y=noteY(n);if(x>=x1-8&&x<=x2+8&&y>=y1-12&&y<=y2+12)selectedSet.add(i)});selected=selectedSet.size?[...selectedSet][0]:-1}selectBox=null}drag=null;renderAll()});
$("tabs").onclick=e=>{let b=e.target.closest("button[data-track]");if(!b)return;active=b.dataset.track;selected=-1;selectedSet.clear();document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));$("trackHint").textContent={bass:"単音ベース",drums:"Kick / Snare / Hi-hat",pad:"コード構成音"}[active];renderAll()};
$("generate").onclick=makeDraft;$("key").onchange=()=>{drawWheel();renderProgression()};$("scale").onchange=()=>{drawWheel();renderProgression()};$("editMode").onchange=updateModeUI;$("rhythmStyle").onchange=()=>{if($("editMode").value==="rhythm")$("aiStatus").textContent="リズムの方向性: "+$("rhythmStyle").selectedOptions[0].textContent};$("degrees").oninput=renderProgression;$("clearTrack").onclick=()=>{tracks[active]=[];selected=-1;selectedSet.clear();renderAll()};$("deleteSelected").onclick=()=>{if(selectedSet.size){tracks[active]=tracks[active].filter((n,i)=>!selectedSet.has(i))}else if(selected>=0)tracks[active].splice(selected,1);selected=-1;selectedSet.clear();renderAll()};
function toMidi(){let m=new Midi();m.header.setTempo(bpm());m.header.timeSignatures=[{ticks:0,timeSignature:meter()}];for(let [name,arr] of Object.entries(tracks)){let t=m.addTrack();t.name=name.toUpperCase();if(name==="drums")t.channel=9;arr.forEach(n=>t.addNote({midi:n.pitch,ticks:Math.round(n.start*m.header.ppq),durationTicks:Math.max(1,Math.round(n.duration*m.header.ppq)),velocity:n.velocity}))}return m}
$("export").onclick=()=>{let blob=new Blob([toMidi().toArray()],{type:"audio/midi"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="musictheory-sketch.mid";a.click();URL.revokeObjectURL(u);$("status").textContent="MIDIを書き出しました。"};
$("midiFile").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let m=new Midi(await f.arrayBuffer());tracks={bass:[],drums:[],pad:[]};selected=-1;selectedSet.clear();m.tracks.forEach(t=>{let target=/drum|perc/i.test(t.name)?"drums":/bass/i.test(t.name)?"bass":/pad|chord|synth/i.test(t.name)?"pad":null;if(target)t.notes.forEach(n=>tracks[target].push({pitch:n.midi,start:n.ticks/m.header.ppq,duration:n.durationTicks/m.header.ppq,velocity:n.velocity}))});renderAll();$("status").textContent="MIDIを読み込みました。トラック名から3種類に振り分けました。"}catch(err){$("status").textContent="MIDIの読み込みに失敗しました: "+err.message}};
function stopPlayback() {
  clearTimeout(playTimer);
  const audio = ctx;
  ctx = null;
  if (audio) audio.close().catch(error => {$("status").textContent = `再生を停止できません: ${error.message}`;});
}

function audition(source, label, status) {
  try {
    stopPlayback();
    ctx = new AudioContext();
    const sec = 60 / bpm(), origin = ctx.currentTime + 0.02;
    for (const [track, notes] of Object.entries(source)) {
      for (const note of notes) {
        if (note.velocity <= 0) continue;
        const time = origin + note.start * sec, oscillator = ctx.createOscillator(), gain = ctx.createGain();
        oscillator.type = track === "bass" ? "triangle" : "sine";
        oscillator.frequency.value = track === "drums" ? (note.pitch === 36 ? 70 : note.pitch === 38 ? 180 : 650) : 440 * Math.pow(2, (note.pitch - 69) / 12);
        gain.gain.setValueAtTime(note.velocity * 0.12, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + Math.max(0.08, note.duration * sec));
        oscillator.connect(gain).connect(ctx.destination);
        oscillator.start(time);
        oscillator.stop(time + Math.max(0.1, note.duration * sec));
      }
    }
    playTimer = setTimeout(stopPlayback, (bars() * beat() * sec + 0.12) * 1000);
    $(status).textContent = `Playing ${label}.`;
  } catch (error) {
    stopPlayback();
    $(status).textContent = `再生できません: ${error.message}`;
  }
}

$("play").onclick = () => audition(tracks, "草案", "status");

let cache, manualBaseline, review;
async function db() {
  if (!cache) {
    cache = await Promise.all(LIBRARIES.map(async name => {
      const response = await fetch(`data/${name}.json`);
      if (!response.ok) throw new Error(`Could not load ${name} (HTTP ${response.status}).`);
      return [name, await response.json()];
    })).then(Object.fromEntries);
  }
  return cache;
}

function inputDraft() {
  const current = structuredClone(draft());
  return {...current, signature: JSON.stringify(current), beatsPerBar: beat(), bars: bars(), mode: $("editMode").value, rhythmOnly: $("editMode").value === "rhythm"};
}

function updateModeUI(){
  const rhythm=$("editMode").value==="rhythm";$("rhythmStyleField").hidden=!rhythm;
  $("request").placeholder=rhythm?"例：ベースを短い反復にし、2小節ごとにアクセントを変える。ノートの追加や間引きも許可する。":"例：2小節目のコードをセカンダリードミナントに置き換え、Padのボイシングを滑らかにする。";
}

function selectKnowledge(data,current,request){
  const mode=current.mode,style=$("rhythmStyle").value,query=(request+" "+style).toLowerCase(),terms=query.split(/[^a-z0-9ぁ-んァ-ヶ一-龠#♭]+/).filter(x=>x.length>1),aliases=[["シャッフル","shuffle","triplet","swing"],["ストレート","straight-pop","pop"],["ハーフタイム","half-time"],["ブレイクビーツ","breakbeat"],["ファンク","funk"],["リディム","riddim","dubstep"],["マスロック","math-rock"]];for(const [ja,...en] of aliases)if(query.includes(ja))terms.push(...en);
  const score=record=>{const text=JSON.stringify(record).toLowerCase();let value=0;for(const term of terms)if(text.includes(term))value+=2;if(mode==="rhythm"&&record.category==="rhythm")value+=4;if(mode==="harmony"&&record.degrees)value+=2;if(record.evidence_type==="academic-research"||record.evidence_type==="human-authored-source")value+=1;return value};
  const limits=mode==="rhythm"?{arrangements:7,"style-moods":4,"composition-rules":5}:{progressions:7,"harmony-techniques":8,"style-moods":4,"composition-rules":5};
  const result={};
  for(const [name,limit] of Object.entries(limits)){
    const records=(data[name]||[]).filter(record=>record.review_status!=="pending").filter(record=>{
      if(mode==="rhythm"&&name==="arrangements"&&style!=="riddim"&&style!=="auto"&&(record.tags||[]).some(tag=>tag==="riddim"))return false;
      if(mode==="rhythm"&&name==="arrangements"&&style==="auto"&&!/riddim|dubstep/i.test(request)&&(record.tags||[]).some(tag=>tag==="riddim"))return false;
      return true;
    }).map(record=>({record,score:score(record)})).sort((a,b)=>b.score-a.score).slice(0,limit);
    result[name]=records.map(({record})=>({id:record.id,name:record.name,summary:record.summary||record.rule||"",degrees:record.degrees||undefined,example:record.example||undefined,tags:record.tags||[],rules:record.rules||undefined,useWhen:record.useWhen||undefined,caution:record.caution||undefined,evidence_type:record.evidence_type||"",confidence:record.confidence||"",source:record.source?{title:record.source.title,author:record.source.author,url:record.source.url}:undefined,notes:(record.notes||"").slice(0,260)}));
  }
  return result;
}

async function buildBrief(current){
  const request=$("request").value.trim();if(!request)throw new Error("アレンジ指示を入力してください。");
  const data=await db(),knowledge=selectKnowledge(data,current,request),style=$("rhythmStyle").value,project={...current.settings,meter:meter(),rhythmStyle:style,tracks:current.tracks};
  const editRules=current.mode==="rhythm"
    ?"MODE: RHYTHM. Preserve tempo, meter, bar count, track roles and the existing pitch vocabulary. You MAY add repeated attacks, omit events, split sustained notes into retriggers, add pickups and rests. DO NOT preserve the original note count; note count may increase or decrease as needed for a convincing groove. For Bass and Pad, every generated pitch must already occur in the same original bar. For Drums, reuse only drum note types already present in the source. Keep notes within their original bars. Bass must remain monophonic. Pad may re-articulate or omit existing chord tones, but must not introduce new pitches. Velocity may vary modestly for accents. Change timing and articulation freely while keeping the harmonic material recognizable."
    :"MODE: HARMONY. Suggest chord / voicing changes only. Pad pitches may change and Bass pitches may change to support the harmony. Keep every Drum event exactly unchanged. Preserve BPM, meter, key, scale, bar count and note timing unless the user explicitly requests a timing change. Keep Bass monophonic. Prefer familiar progressions and apply no more than two reharmonization techniques unless requested.";
  return [
    "You are arranging a short composition sketch. Return only JSON matching the supplied schema. Write candidate names and summaries in concise Japanese. Provide one or two useful alternatives. Each candidate must contain Bass, Drums and Pad exactly once. Include a concise musical explanation and cite only source IDs that exist in the supplied knowledge data. Do not invent source IDs.",
    "Use quarter-note beats for start and duration. Stay within the project length. Bass must be monophonic. Drum pitches are GM 36 (kick), 38 (snare) and 42 (closed hi-hat) only. Velocity is 0 to 1.",
    editRules,
    "PROJECT: "+JSON.stringify(project),
    "USER REQUEST: "+request,
    "RELEVANT KNOWLEDGE: "+JSON.stringify(knowledge),
    "OUTPUT SCHEMA: "+JSON.stringify(candidateSchema)
  ].join("\n");
}
function ensureCurrent(current) {
  if (current.signature !== JSON.stringify(draft())) throw new Error("The draft changed. Build a new brief or generate again for this draft.");
}

async function makeManualBrief() {
  const current = inputDraft();
  try {
    const prompt = await buildBrief(current);
    ensureCurrent(current);
    $("brief").value = prompt;
    manualBaseline = {signature: current.signature, rhythmOnly: current.rhythmOnly};
    $("aiStatus").textContent = "依頼文を作成しました。";
  } catch (error) {
    $("aiStatus").textContent = error.message;
  }
}

$("buildBrief").onclick = makeManualBrief;

function updateReview() {
  if (!review) return;
  const index = Number($("candidate").value);
  const choice = review.candidates[index];
  if (!choice) return;
  $("candidateSummary").textContent = choice.summary;
  const counts = Object.entries(choice.tracks).map(([name, notes]) => {
    const before = review.originalTracks[name]?.length ?? 0;
    return name + " " + before + "→" + notes.length;
  }).join(" / ");
  const sourceText = choice.sources.length ? " · " + choice.sources.join(", ") : "";
  const appliedText = review.appliedIndex === index ? " · 反映済み" : "";
  $("candidateNotes").textContent = counts + sourceText + appliedText;
}

function stageCandidates(raw, current, {autoApply = false} = {}) {
  ensureCurrent(current);
  const candidates = parseCandidates(raw, current);
  review = {current, candidates, originalTracks: structuredClone(current.tracks), appliedIndex: -1};
  $("candidate").replaceChildren(...candidates.map((entry, index) => new Option(entry.name, index)));
  $("candidate").value = "0";
  $("review").hidden = false;
  updateReview();
  if (autoApply) applyChoice(0);
  else $("aiStatus").textContent = candidates.length + "件の候補を読み込みました。";
}

$("candidate").onchange = updateReview;
$("reviewJson").onclick = () => {
  try {
    const current = inputDraft();
    if (manualBaseline) ensureCurrent(manualBaseline);
    stageCandidates(JSON.parse($("aiJson").value), current);
  } catch (error) {
    $("review").hidden = true;
    $("aiStatus").textContent = "JSONを読み込めません: " + error.message;
  }
};

const apiPath = "./api/arrangements";
async function enableLocalApi(){
 $("arrange").disabled=true;$("apiState").textContent="API未接続";
 if(!["127.0.0.1","localhost"].includes(location.hostname)){ $("apiState").textContent="手動モード";return; }
 try{const response=await fetch(apiPath,{signal:AbortSignal.timeout(5000)});if(!response.ok)throw new Error("HTTP "+response.status);const info=await response.json();$("arrange").disabled=!info.available;$("apiState").textContent=info.available?"APIキー設定済み · "+(info.model||"OpenAI"):"APIキー未設定";}
 catch(error){$("apiState").textContent="API未接続";$("aiStatus").textContent="ローカルAPIに接続できません: "+error.message;}
}

$("arrange").onclick=async()=>{
 const current=inputDraft();$("arrange").disabled=true;$("aiStatus").textContent="指示と関連資料を整理中…";
 let elapsed=0,interval=null,timeout=null,controller=null;
 try{
   const prompt=await buildBrief(current);ensureCurrent(current);
   controller=new AbortController();interval=setInterval(()=>{elapsed++;$("aiStatus").textContent="AIがアレンジ候補を生成中… "+elapsed+"秒";},1000);
   timeout=setTimeout(()=>controller.abort(),125000);$("aiStatus").textContent="AIに送信しました。応答を待っています…";
   const response=await fetch(apiPath,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt}),signal:controller.signal});
   let raw;try{raw=await response.json()}catch{throw new Error("サーバーからJSON形式の応答がありません。ターミナルのログを確認してください。")}
   if(!response.ok)throw new Error(raw.error||"HTTP "+response.status);
   $("aiStatus").textContent="候補を検証してMIDIに反映中…";
   stageCandidates(raw,current,{autoApply:true});
 }catch(error){
   const message=error.name==="AbortError"?"120秒以内に応答がありませんでした。入力を短くするか、ターミナルのエラーを確認してください。":error.message;
   $("aiStatus").textContent="生成できませんでした: "+message;
 }finally{if(interval)clearInterval(interval);if(timeout)clearTimeout(timeout);$("arrange").disabled=false;}
};

function withCandidate(fn) {
  return () => {
    try {
      ensureCurrent(review.current);
      fn(review.candidates[Number($("candidate").value)]);
    } catch (error) {
      $("aiStatus").textContent = error.message;
    }
  };
}

function loadDraft(state) {
  tracks = state.tracks;
  for (const [key, value] of Object.entries(state.settings || {})) {
    const input = $(key);
    if (input) input.value = value;
  }
  selected = -1;
  selectedSet.clear();
  updateModeUI();
  renderAll();
  renderProgression();
}

function applyChoice(index) {
  ensureCurrent(review.current);
  const choice = review.candidates[index];
  if (!choice) throw new Error("候補が選択されていません。");
  if (review.appliedIndex === -1) beforeAI = structuredClone(draft());
  stopPlayback();
  loadDraft({...draft(), tracks: structuredClone(choice.tracks)});
  review.current = inputDraft();
  review.appliedIndex = index;
  $("undoAI").hidden = false;
  manualBaseline = null;
  updateReview();
  $("aiStatus").textContent = "「" + choice.name + "」をMIDIに反映しました。";
}

$("playOriginal").onclick = withCandidate(() => audition(review.originalTracks, "元のMIDI", "aiStatus"));
$("playCandidate").onclick = withCandidate(choice => audition(choice.tracks, choice.name, "aiStatus"));
$("applyCandidate").onclick = withCandidate(() => applyChoice(Number($("candidate").value)));
$("undoAI").onclick = () => {
  if (!beforeAI) return;
  if (!confirm("AIを適用する前のMIDIに戻しますか？現在の編集内容は置き換わります。")) return;
  stopPlayback();
  const previous = beforeAI;
  beforeAI = manualBaseline = null;
  review = null;
  loadDraft(previous);
  $("undoAI").hidden = $("review").hidden = true;
  $("aiStatus").textContent = "適用前のMIDIに戻しました。";
};

async function showDb() {
  const labels = {
    progressions: "コード進行",
    "harmony-techniques": "和声技法",
    "style-moods": "ジャンル・雰囲気",
    arrangements: "アレンジ",
    "composition-rules": "作曲ルール"
  };
  try {
    const data = await db();
    const render = () => {
      const query = $("knowledgeSearch").value.trim().toLowerCase();
      const root = $("knowledge");
      root.replaceChildren();
      let total = 0;
      for (const [name, records] of Object.entries(data)) {
        const matches = records.filter(record => {
          const haystack = JSON.stringify(record).toLowerCase();
          return !query || haystack.includes(query);
        });
        if (!matches.length) continue;
        total += matches.length;
        const section = document.createElement("section");
        section.className = "kb-library";
        const heading = document.createElement("h4");
        heading.textContent = labels[name] + " · " + matches.length;
        section.append(heading);
        const grid = document.createElement("div");
        grid.className = "kb-records";
        for (const record of matches) {
          const card = document.createElement("article");
          card.className = "kb-record";
          const title = document.createElement("b");
          title.textContent = record.name || record.id;
          card.append(title);
          const summary = record.summary || record.rule || record.notes || "";
          if (summary) {
            const p = document.createElement("p");
            p.textContent = summary;
            card.append(p);
          }
          if (record.degrees?.length) {
            const p = document.createElement("p");
            p.textContent = "度数: " + record.degrees.join(" – ");
            card.append(p);
          }
          if (record.example?.length) {
            const p = document.createElement("p");
            p.textContent = "例: " + record.example.join(" → ");
            card.append(p);
          }
          if (record.tags?.length) {
            const p = document.createElement("p");
            p.textContent = record.tags.join(" · ");
            card.append(p);
          }
          const source = record.source;
          if (source?.url) {
            const link = document.createElement("a");
            link.href = source.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = source.title || "出典";
            card.append(link);
          }
          if (record.review_status === "pending") {
            const badge = document.createElement("p");
            badge.textContent = "要確認";
            badge.style.color = "#a66a35";
            card.append(badge);
          }
          grid.append(card);
        }
        section.append(grid);
        root.append(section);
      }
      if (!total) root.textContent = "該当する項目はありません。";
    };
    $("knowledgeSearch").addEventListener("input", render);
    render();
  } catch (error) {
    $("knowledge").textContent = error.message;
  }
}
