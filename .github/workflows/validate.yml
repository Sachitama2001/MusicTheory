name: Validate MusicTheory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate knowledge JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("data").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY
      - name: Check browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index('<script type="module">') + len('<script type="module">')
          end = html.index('</script>', start)
          Path('/tmp/app.mjs').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/app.mjs
