<section class="panel">
<div class="row spread"><h3 class="sectiontitle">アレンジ指示</h3><span class="tag" id="apiState">API未接続</span></div>
<div class="row" style="margin:8px 0"><div class="field"><label>変更対象</label><select id="editMode"><option value="harmony">コード</option><option value="rhythm">リズム</option></select></div></div>

function stopPlayback() {
  clearTimeout(playTimer);
  const audio = ctx;
  ctx = null;
  if (audio) audio.close().catch(error => {$("status").textContent = `Could not stop playback: ${error.message}`;});
}

function audition(source, label, status) {
  try {
    stopPlayback();
    ctx = new AudioContext();
    const sec = 60 / bpm(), origin = ctx.currentTime + 0.02;
    for (const [track, notes] of Object.entries(source)) {
      for (const note of notes) {
        if (note.velocity <= 0) continue;
        const time = origin + note.start * sec, oscillator = ctx.createOscillator(), gain = ctx.createGain();
        oscillator.type = track === "bass" ? "triangle" : "sine";
        oscillator.frequency.value = track === "drums" ? (note.pitch === 36 ? 70 : note.pitch === 38 ? 180 : 650) : 440 * Math.pow(2, (note.pitch - 69) / 12);
        gain.gain.setValueAtTime(note.velocity * 0.12, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + Math.max(0.08, note.duration * sec));
        oscillator.connect(gain).connect(ctx.destination);
        oscillator.start(time);
        oscillator.stop(time + Math.max(0.1, note.duration * sec));
      }
    }
    playTimer = setTimeout(stopPlayback, (bars() * beat() * sec + 0.12) * 1000);
    $(status).textContent = `Playing ${label}.`;
  } catch (error) {
    stopPlayback();
    $(status).textContent = `Playback failed: ${error.message}`;
  }
}

let cache, manualBaseline, review;
async function db() {
  if (!cache) {
    cache = await Promise.all(LIBRARIES.map(async name => {
      const response = await fetch(`data/${name}.json`);
      if (!response.ok) throw new Error(`Could not load ${name} (HTTP ${response.status}).`);
      return [name, await response.json()];
    })).then(Object.fromEntries);
  }
  return cache;
}

function inputDraft() {

  return {...current, signature: JSON.stringify(current), beatsPerBar: beat(), bars: bars(), rhythmOnly: $("rhythmOnly").checked};

  const knowledge = await db();
  const rhythm = current.rhythmOnly
    ? "Change only onset and duration. Preserve every note's pitch, velocity and onset bar; keep each note within that bar. Keep Pad chord groups intact and in order."
    : "Use the requested harmony or rhythm changes; keep the project settings unchanged.";
  return [
    "Act as a music composition assistant. Return just one JSON object matching the schema below, with two distinct candidates when practical, otherwise one. Include a brief explanation in summary and cite relevant knowledge record IDs in sources. Give a complete replacement for each candidate, with each of Bass, Drums and Pad exactly once. Do not add other tracks.",
    "Use quarter-note beats for start and duration. Stay within the project length. Bass must be monophonic. Drum pitches are GM 36, 38 and 42 only. Velocity is 0 to 1.",
    rhythm,
    `SCHEMA: ${JSON.stringify(candidateSchema)}`,
    `PROJECT: ${JSON.stringify({...project, tracks: current.tracks})}`,
    `USER REQUEST: ${request}`,
    `KNOWLEDGE: ${JSON.stringify(knowledge)}`
  ].join("\n");
}

function ensureCurrent(current) {
  if (current.signature !== JSON.stringify(draft())) throw new Error("The draft changed. Build a new brief or generate again for this draft.");
}

async function makeManualBrief() {
  const current = inputDraft();
  try {
    const prompt = await buildBrief(current);
    ensureCurrent(current);
    $("brief").value = prompt;
    manualBaseline = {signature: current.signature, rhythmOnly: current.rhythmOnly};
    $("aiStatus").textContent = "Brief ready to copy.";
  } catch (error) {
    $("aiStatus").textContent = error.message;
  }
}

$("buildBrief").onclick = makeManualBrief;
$("rhythm").onclick = () => {
  $("rhythmOnly").checked = true;
  $("request").value = "Create two Riddim-inspired options: a restrained half-time groove and a stronger triplet shuffle with call-and-response gaps. Try moving an existing snare to beat 3 in 4/4 if the rhythm-only constraints allow it. In other meters, use a backbeat that fits the meter. Use shorter bass notes, deliberate rests and offbeats without adding or removing notes.";
  return makeManualBrief();
};

function updateReview() {
  const choice = review.candidates[Number($("candidate").value)];
  $("candidateSummary").textContent = choice.summary;
  const counts = Object.entries(choice.tracks).map(([name, notes]) => `${name}: ${tracks[name].length} to ${notes.length}`).join(" / ");
  $("candidateNotes").textContent = `${counts} notes${choice.sources.length ? ` | Sources: ${choice.sources.join(", ")}` : ""}`;
}

function stageCandidates(raw, current) {
  ensureCurrent(current);
  const candidates = parseCandidates(raw, current);
  review = {current, candidates};
  $("candidate").replaceChildren(...candidates.map((entry, index) => new Option(entry.name, index)));
  $("review").hidden = false;
  updateReview();
  $("aiStatus").textContent = `${candidates.length} candidate(s) ready. The draft is unchanged.`;
}

$("candidate").onchange = updateReview;
$("reviewJson").onclick = () => {
  try {
    const current = inputDraft();
    if (manualBaseline) ensureCurrent(manualBaseline);
    stageCandidates(JSON.parse($("aiJson").value), {...current, rhythmOnly: current.rhythmOnly || manualBaseline?.rhythmOnly});
  } catch (error) {
    $("review").hidden = true;
    $("aiStatus").textContent = `Could not load AI JSON: ${error.message}`;
  }
};

const apiPath = "./api/arrangements";
async function enableLocalApi() {
  if (!["127.0.0.1", "localhost"].includes(location.hostname)) return;
  try {
    const response = await fetch(apiPath);
    if (response.status === 404) return;
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const {available} = await response.json();
    $("arrange").hidden = $("apiNotice").hidden = !available;
  } catch (error) {
    $("aiStatus").textContent = `Could not check the local OpenAI API: ${error.message}`;
  }
}

$("arrange").onclick = async () => {
  const current = inputDraft();
  $("arrange").disabled = true;
  $("aiStatus").textContent = "Generating candidates with OpenAI...";
  try {
    const prompt = await buildBrief(current);
    ensureCurrent(current);
    const response = await fetch(apiPath, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({prompt})
    });
    const raw = await response.json();
    if (!response.ok) throw new Error(raw.error || `HTTP ${response.status}`);
    stageCandidates(raw, current);
  } catch (error) {
    $("aiStatus").textContent = `OpenAI generation failed: ${error.message}`;
  } finally {
    $("arrange").disabled = false;
  }
};

function withCandidate(fn) {
  return () => {
    try {
      ensureCurrent(review.current);
      fn(review.candidates[Number($("candidate").value)]);
    } catch (error) {
      $("aiStatus").textContent = error.message;
    }
  };
}

function loadDraft(state) {
  tracks = state.tracks;
  for (const [key, value] of Object.entries(state.settings || {})) {
    const input = $(key);
    if (input) input.value = value;
  }
  selected = -1;
  selectedSet.clear();
  renderAll();
  renderProgression();
}

$("playOriginal").onclick = withCandidate(() => audition(tracks, "original", "aiStatus"));
$("playCandidate").onclick = withCandidate(choice => audition(choice.tracks, choice.name, "aiStatus"));
$("applyCandidate").onclick = withCandidate(choice => {
  stopPlayback();
  beforeAI = structuredClone(draft());
  loadDraft({...beforeAI, tracks: choice.tracks});
  $("review").hidden = true;
  $("undoAI").hidden = false;
  manualBaseline = null;
  $("aiStatus").textContent = `Applied ${choice.name}. The previous draft can be restored.`;
});
$("undoAI").onclick = () => {
  if (!confirm("Restore the draft saved before the last AI apply? This replaces the current draft, including any later edits.")) return;
  stopPlayback();
  const previous = beforeAI;
  beforeAI = manualBaseline = null;
  loadDraft(previous);
  $("undoAI").hidden = $("review").hidden = true;
  $("aiStatus").textContent = "Restored the pre-AI draft.";
};

async function showDb() {
  try {
    const data = await db();
    for (const [name, records] of Object.entries(data)) {
      const article = document.createElement("article");
      article.innerHTML = `<b>${name.toUpperCase()}</b><p>${records.length} records</p>`;
      $("knowledge").append(article);
    }
  } catch (error) {
    $("knowledge").textContent = error.message;
  }
}

initKeys();
try {
  const saved = JSON.parse(localStorage.getItem("musictheory-draft") || "null");
  if (saved?.tracks) {
    beforeAI = saved.beforeAI || null;
    $("undoAI").hidden = !beforeAI;
    loadDraft(saved);
  } else {
    makeDraft();
  }
} catch {
  $("status").textContent = "Could not load the saved draft. Generate a new draft to continue.";
}
showDb();
enableLocalApi();
</script></body></html>
